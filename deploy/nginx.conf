# Configuracion de Nginx para el CV.
# Copiala a /etc/nginx/sites-available/askedgar y AJUSTA:
#   - server_name: tu IP externa y/o tu dominio.
#   - las rutas de /static/ y /media/ (donde clonaste el repo).
#
# Luego:
#   sudo ln -s /etc/nginx/sites-available/askedgar /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#
# Certbot editara este archivo solo para anadir HTTPS (puerto 443).

server {
    listen 80;
    server_name TU_IP_O_DOMINIO;

    # Permite subir imagenes del portafolio desde el admin.
    client_max_body_size 12M;

    # Archivos estaticos (CSS/JS/fuentes) generados por collectstatic.
    location /static/ {
        alias /home/CAMBIA_USUARIO/portafolio-django/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Archivos subidos (imagenes del portafolio).
    location /media/ {
        alias /home/CAMBIA_USUARIO/portafolio-django/media/;
        expires 30d;
        access_log off;
    }

    # Todo lo demas va a Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
